[project]
name = "ai-operations-spec"
version = "0.6.1"
description = "Language-neutral operational data specification for AI systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema[format]>=4.23,<5",
    "pytest>=8,<10",
]

[dependency-groups]
docs = ["mkdocs>=1.6,<2"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = [
    "tests",
    "drafts/v0.4/tests",
]
